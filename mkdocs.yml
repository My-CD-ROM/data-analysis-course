          - "15. Критерії узгодженості й таблиці спряженості: критерій хі-квадрат": practice/15-chi-square.md
      - "Модуль 3. Залежності, регресія та математичні моделі":
          - "16. Кореляційний аналіз: діаграма розсіювання, коефіцієнти Пірсона і Спірмена, кореляційна матриця": practice/16-correlation.md
          - "17. Проста лінійна регресія: побудова моделі, коефіцієнти, залишки, коефіцієнт детермінації": practice/17-simple-regression.md
          - "18. Множинна лінійна регресія: відбір предикторів, інтерпретація коефіцієнтів, діагностика залишків": practice/18-multiple-regression.md
          - "19. Класифікація математичних моделей: аналіз прикладів, перевірка адекватності моделі": practice/19-model-adequacy.md
          - "20. Лінійне програмування: постановка задачі, розв'язання засобами scipy": practice/20-linear-programming.md
      - "Модуль 4. Випадковість у моделюванні, часові ряди та машинне навчання":
          - "21. Метод Монте-Карло: обчислення площі та інтеграла, оцінка сподівання, збіжність за кількістю випробувань": practice/21-monte-carlo.md
          - "22. Часовий ряд: побудова, ковзне середнє, виділення тренду і прогноз на кілька кроків": practice/22-time-series.md
