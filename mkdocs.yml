site_name: Аналіз даних і математичне моделювання
site_description: Матеріали лекцій і практичних занять курсу
site_author: Роман Боба

theme:
  name: material
  language: uk
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Темна тема
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Світла тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Курс: index.md
  - Лекції:
      - "Модуль 1. Інструменти, дані та описова статистика":
          - "1. Вступ": lectures/01-vstup.md
          - "2. NumPy: масиви і векторизовані обчислення": lectures/02-numpy.md
          - "3. pandas: Series, DataFrame, індекс, відбір і обчислювані стовпці": lectures/03-pandas.md
          - "4. Шкали вимірювання і типи змінних": lectures/04-tidy-data.md
          - "5. Чищення даних: пропуски, дублікати, типи, кодування": lectures/05-cleaning.md
          - "6. Частотний розподіл однієї змінної: варіаційний ряд і гістограма": lectures/06-frequency-distribution.md
          - "7. Міри розсіювання і форма розподілу": lectures/07-dispersion-visualization.md
          - "8. Принципи коректної візуалізації і типові спотворення": lectures/08-visualization-grouping.md
          - "9. Похідні змінні: дискретизація, масштабування, кодування категорій": lectures/09-derived-variables.md
      - "Модуль 2. Випадковість, розподіли і статистичний висновок":
          - "10. Випадкові події та ймовірність": lectures/10-probability.md
          - "11. Неперервні й дискретні розподіли: рівномірний, нормальний, експоненційний, біноміальний, Пуассона": lectures/11-distributions.md
          - "12. Закон великих чисел і центральна гранична теорема": lectures/12-clt-lln.md
          - "13. Довірчі інтервали": lectures/13-confidence-intervals.md
          - "14. Перевірка статистичних гіпотез: логіка, p-value, помилки I і II роду": lectures/14-hypothesis-testing.md
          - "15. Параметричні критерії порівняння середніх і дисперсій": lectures/15-parametric-tests.md
          - "16. Критерії узгодженості й перевірка нормальності": lectures/16-goodness-of-fit.md
      - "Модуль 3. Залежності, регресія та математичні моделі":
          - "17. Кореляційний аналіз: Пірсон, Спірмен і обмеження застосування": lectures/17-correlation.md
          - "18. Множинна лінійна регресія: побудова, діагностика, інтерпретація": lectures/18-multiple-regression.md
          - "19. Поняття математичної моделі й етапи моделювання": lectures/19-model-classification.md
          - "20. Задачі оптимізації та лінійне програмування": lectures/20-optimization.md
      - "Модуль 4. Випадковість у моделюванні, часові ряди та машинне навчання":
          - "21. Генерація випадкових чисел і випадкових потоків": lectures/21-monte-carlo.md
          - "22. Часові ряди: структура і згладжування": lectures/22-time-series.md
          - "23. Машинне навчання: постановка задачі, навчальна і тестова вибірки, перенавчання, метрики якості (огляд)": lectures/23-ml-intro.md
  - Практичні:
      - "Модуль 1. Інструменти, дані та описова статистика":
          - "1. Робоче середовище і NumPy: віртуальне середовище, ноутбук, масиви й векторизовані обчислення": practice/01-numpy-env.md
          - "2. pandas: побудова DataFrame, індекс, відбір рядків і стовпців, обчислювані стовпці": practice/02-pandas.md
          - "3. Приведення набору до tidy data; читання і запис таблиць (CSV, Excel, JSON)": practice/03-tidy-data.md
          - "4. Чищення набору: пропуски, дублікати, типи, узгодження категорій": practice/04-cleaning.md
          - "5. Шкали вимірювання і частотний розподіл: класифікація набору, варіаційний ряд, гістограма": practice/05-frequency.md
          - "6. Описова статистика: міри положення і розсіювання, describe, порівняння груп": practice/06-descriptive-stats.md
          - "7. Візуалізація: Figure і Axes, підписи, гістограма, boxplot, діаграма розсіювання": practice/07-visualization.md
          - "8. Групування і зведені таблиці: groupby, агрегувальні функції, pivot_table, crosstab": practice/08-groupby-pivot.md
          - "9. Перетворення даних: похідні змінні, дискретизація, масштабування, індикаторне кодування": practice/09-feature-transform.md
      - "Модуль 2. Випадковість, розподіли і статистичний висновок":
          - "10. Неперервні розподіли в scipy": practice/10-scipy-distributions.md
          - "11. Числові характеристики випадкової величини; закон великих чисел і ЦГТ симуляцією": practice/11-clt-simulation.md
          - "12. Довірчі інтервали для середнього і частки": practice/12-confidence-intervals.md
          - "13. Точкові оцінки та перевірка гіпотез: обчислення p-value, інтерпретація результату": practice/13-hypothesis-testing.md
